<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Matematika Kelas 7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f6fb;--ln:#dfe7f2;--card:#fff;--tx:#14213d;--mu:#5b6880;--pr:#2457d6;--pt:#fff;--ok:#0b7f5f;--okb:#e0f5ee;--no:#c23b3b;--nob:#fde8e8;--gu:#9a6200;--gub:#fff3d6;--c1:#2457d6;--c2:#0f9d76;--c3:#f08c00;--c4:#c23b3b;--bd:#cfd9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--ln:#18233a;--card:#18223a;--tx:#e6ecf8;--mu:#9aa8c2;--pr:#7ea2ff;--pt:#0f1624;--ok:#4fd1a5;--okb:#12362d;--no:#ff8585;--nob:#3b1c24;--gu:#f5c160;--gub:#3a2e12;--c1:#7ea2ff;--c2:#4fd1a5;--c3:#f5a73b;--c4:#ff8585;--bd:#2b3a5a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.55 Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--bg);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 4px}
p{margin:0 0 10px}.mu{color:var(--mu)}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
button,input{font:inherit}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--pr);border:1.5px solid var(--bd)}
button:focus-visible,input:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);margin:8px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--okb);color:var(--ok)}.tag.g{background:var(--gub);color:var(--gu)}
.menu{display:grid;gap:12px}.mi{text-align:left;width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;color:var(--tx)}
.mi b{display:block;font-size:20px}.mi:hover{border-color:var(--pr)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt:disabled{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin:0 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.exp{border-left:5px solid var(--ok);background:var(--okb);border-radius:10px;padding:12px 14px;margin-top:12px}
.exp.no{border-color:var(--no);background:var(--nob)}.exp.gu{border-color:var(--gu);background:var(--gub)}
.exp ol,.exp ul{margin:4px 0 8px;padding-left:20px}svg{max-width:100%;height:auto;display:block;margin:8px 0}
.lg{font-size:13px;color:var(--mu)}.lg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px}
.mono{font-variant-numeric:tabular-nums}
.mh{background:linear-gradient(135deg,#2457d6,#0f9d76);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:12px}.mh small{opacity:.85}
.dots{display:flex;gap:6px;margin:0 0 14px}.dots i{flex:1;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--c2)}.dots i.cur{background:var(--c3)}
.fm{font-size:19px;font-weight:700;text-align:center;padding:12px;margin:10px 0;border-radius:12px;background:var(--gub);border:2px dashed var(--gu)}.qz{border:2px solid var(--pr);border-radius:12px;padding:12px 14px;margin-top:16px}.btn:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),C=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const T=(x,y,t,a='middle',c='var(--tx)',s=11)=>`<text x="${x}" y="${y}" text-anchor="${a}" fill="${c}" font-size="${s}">${t}</text>`;
// ilustrasi: kolom bertumpuk (satu kolom = satu hari/menit/tahun)
function cols(n,f,u,W,cl){let H=4;for(let i=0;i<n;i++)H=Math.max(H,f(i).reduce((p,c)=>p+c,0)*u+4);let o='';
for(let i=0;i<n;i++){let y=H;f(i).forEach((v,k)=>{y-=v*u;if(v)o+=`<rect x="${i*(W+3)}" y="${y}" width="${W}" height="${v*u-1}" rx="2" fill="${cl[k]}"/>`})}
return `<svg viewBox="0 0 ${n*(W+3)} ${H}" width="${Math.min(n*(W+3),420)}">${o}</svg>`}
const lg=(a)=>`<div class="lg">${a.map(([c,t])=>`<b style="background:${C[c]}"></b>${t}`).join('')}</div>`;
const IL={
1(){const x=v=>20+(v+150)*2.2,P=[[-150,'−150'],[-70,'−70'],[-115,'−115'],[-30,'−30']];
const arc=(a,b,t,c)=>`<path d="M${x(a)} 60 Q${(x(a)+x(b))/2} ${a<b?10:100} ${x(b)} 60" fill="none" stroke="${c}" stroke-width="2"/>${T((x(a)+x(b))/2,a<b?24:112,t,'middle',c,12)}`;
return `<svg viewBox="0 0 370 125" width="400"><line x1="10" y1="60" x2="360" y2="60" stroke="var(--mu)" stroke-width="2"/>${P.map(([v,l])=>`<circle cx="${x(v)}" cy="60" r="5" fill="var(--tx)"/>${T(x(v),78,l,'middle','var(--tx)',11)}`).join('')}${arc(-150,-70,'+80',C[1])}${arc(-70,-115,'−45',C[3])}${arc(-115,-30,'+85 (x)',C[0])}${T(x(0),52,'0 (laut)','end','var(--mu)',10)}</svg>`},
2(){let o='',S=1.45,r=[[12,0],[18,1],[24,2]];r.forEach(([p,k],i)=>{o+=T(0,26+i*26,['Merah','Kuning','Hijau'][i],'start','var(--mu)',10);for(let t=p;t<=216;t+=p)o+=`<circle cx="${44+t*S}" cy="${22+i*26}" r="4" fill="${C[[3,2,1][i]]}"/>`});
[72,144,216].forEach((t,i)=>o+=`<line x1="${44+t*S}" y1="4" x2="${44+t*S}" y2="84" stroke="${C[0]}" stroke-width="2" stroke-dasharray="3 3"/>`+T(44+t*S,100,`${t} dtk`,'middle',C[0],11));
return `<svg viewBox="0 0 370 106" width="400">${o}</svg>`+lg([[0,'garis putus = serempak (kelipatan 72 detik)']])},
12(){return cols(6,i=>i<3?[3,2,0]:[3,2,2],14,28,C.slice(0,3).concat([C[2]]).map((c,k)=>[C[0],C[1],C[2]][k]))+lg([[0,'tukang 1 (3 bagian/hari)'],[1,'tukang 2 (2)'],[2,'tukang 3 (2), mulai hari ke-4']])+'<p class="lg">Satu kotak = 1/36 pekerjaan. Hari 1–6 total 15 + 21 = 36 kotak = selesai.</p>'},
28(){return cols(20,()=>[3,2,1],12,12,[C[0],C[1],C[2]])+lg([[0,'pelari 1: 3 bagian/menit'],[1,'pelari 2: 2'],[2,'pelari 3: 1']])+'<p class="lg">Lintasan = 120 bagian. Tiap menit selesai 6 bagian → 20 menit.</p>'},
17(){return cols(4,i=>[5,[.4,.8,1.2,1.4][i]],36,56,[C[0],C[2]])+lg([[0,'modal Rp5 juta'],[2,'bunga (Rp0,4 juta/tahun)']])+'<p class="lg">Tahun ke-1: 5,4 · ke-2: 5,8 · ke-3: 6,2 · ke-3,5: 6,4 (juta rupiah).</p>'},
26(){return `<svg viewBox="0 0 380 54" width="420"><rect x="0" y="6" width="323" height="30" rx="4" fill="${C[1]}"/><rect x="323" y="6" width="57" height="30" rx="4" fill="${C[3]}"/>${T(161,26,'85% = Rp3.825.000','middle','#fff',12)}${T(351,26,'15%','middle','#fff',12)}${T(190,52,'100% = Rp4.500.000 (harga sudah + PPN)','middle','var(--mu)',10)}</svg>`},
t1(){let o='';for(let i=0;i<9;i++){const x=22+i*44,v=20-3*i;o+=`<circle cx="${x}" cy="32" r="5" fill="${i==8?C[3]:C[0]}"/>`+T(x,20,(v<0?'−':'')+Math.abs(v)+'°')+T(x,54,5*i,'middle','var(--mu)',10)}return `<svg viewBox="0 0 400 64" width="420"><line x1="22" y1="32" x2="374" y2="32" stroke="var(--bd)" stroke-width="2"/>${o}</svg><p class="lg">Atas: suhu (°C). Bawah: menit. Turun 3° tiap 5 menit, sebanyak 8 kali → 40 menit.</p>`},
p2(){return sq([5,5],[C[1],'var(--bd)'],26,22)+'<p class="lg">Atas = 5/10 (3/5 − 1/10)</p>'+sq([7,3],[C[2],'var(--bd)'],26,22)+'<p class="lg">Bawah = 7/10 (2/5 + 3/10). Atas : bawah = 5 : 7 → 5/7.</p>'},
h13(){const v='aeiou'.split('');let o='';for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)o+=`<span class="tag" style="margin:3px;display:inline-block">{${v[i]}, ${v[j]}}</span>`;return `<div>${o}</div><p class="lg">10 pasangan: 5 × 4 ÷ 2 = 10.</p>`},
h14(){return `<svg viewBox="0 0 330 150" width="360"><rect x="2" y="2" width="326" height="146" rx="8" fill="none" stroke="var(--bd)" stroke-width="2"/><circle cx="125" cy="75" r="55" fill="${C[0]}" fill-opacity=".35" stroke="${C[0]}" stroke-width="2"/><circle cx="205" cy="75" r="55" fill="${C[2]}" fill-opacity=".35" stroke="${C[2]}" stroke-width="2"/>`+T(95,80,'10','middle','var(--tx)',18)+T(165,80,'5','middle','var(--tx)',18)+T(235,80,'17','middle','var(--tx)',18)+T(300,135,'3','middle',C[3],18)+T(95,28,'Matematika','middle',C[0],11)+T(235,28,'B. Inggris','middle',C[2],11)+T(40,140,'S = 35','start','var(--mu)',10)+'</svg>'},
a12(){return `<svg viewBox="0 0 330 124" width="360"><line x1="165" y1="30" x2="165" y2="100" stroke="var(--mu)" stroke-width="3"/><line x1="40" y1="30" x2="290" y2="30" stroke="var(--tx)" stroke-width="3"/><rect x="40" y="38" width="100" height="34" rx="6" fill="${C[0]}" fill-opacity=".25" stroke="${C[0]}"/><rect x="190" y="38" width="100" height="34" rx="6" fill="${C[2]}" fill-opacity=".25" stroke="${C[2]}"/>`+T(90,60,'−6x + 26','middle','var(--tx)',13)+T(240,60,'10x + 10','middle','var(--tx)',13)+T(165,118,'seimbang → 16 = 16x → x = 1','middle','var(--mu)',11)+'</svg>'},
k5(){return sq([3,1],[C[0],'var(--bd)'],80,34)+'<p class="lg">1 blok = 0,5 liter = 27,5 km. Terpakai 3 blok (1,5 L) = 82,5 km. Blok abu-abu = sisa 0,5 L.</p>'},
k6(){return pbar(.85,'bayar 85% = Rp68.000','15%',C[3],'harga awal 100% = Rp80.000')},
k7(){return pbar(1/1.2,'modal 100% = Rp2.500.000','20%',C[2],'tabungan sekarang 120% = Rp3.000.000')},
k20(){return sq([9,20],[C[0],C[2]],12,26)+lg([[0,'3 mawar = 9 kotak'],[2,'4 lili = 20 kotak']])+'<p class="lg">29 kotak = Rp72.500 → 1 kotak = Rp2.500.</p>'},
u1(){let o='';for(let v=-80;v<=-76;v++){const x=40+(v+80)*70;o+=`<line x1="${x}" y1="52" x2="${x}" y2="62" stroke="var(--mu)"/>`+T(x,76,'−'+-v,'middle','var(--tx)',12)}return `<svg viewBox="0 0 330 84" width="380"><line x1="30" y1="57" x2="320" y2="57" stroke="var(--mu)" stroke-width="2"/>${o}<path d="M40 52 Q145 4 250 52" fill="none" stroke="${C[1]}" stroke-width="2"/>${T(145,22,'+3 (dari 24 ÷ 8)','middle',C[1],12)}<circle cx="250" cy="57" r="5" fill="${C[0]}"/></svg><p class="lg">16 × (−5) = −80 (titik awal), lalu +3 → −77.</p>`},
p3(){return hb([[56.75,'56,75',C[0]],[80.5,'80,5',C[1]],[90.25,'90,25',C[2]]],'227,5 kg ÷ 3,5 kg = 65 orang')},
v13(){return venn('3, 6, 9, 12','4, 7','1, 5, 8, 10','0, 2, 11','A','B','S')+'<p class="lg">Kiri = hanya A · tengah = irisan · kanan = hanya B · merah = di luar kedua lingkaran.</p>'},
v14(){return venn('9','3','13','5','Menari','Menyanyi','S = 30')+'<p class="lg">Menari saja 9 · keduanya 3 · menyanyi saja 13 · tidak keduanya 5. Total 9 + 3 + 13 + 5 = 30.</p>'},
a12b(){return `<svg viewBox="0 0 330 66" width="380"><line x1="20" y1="30" x2="320" y2="30" stroke="var(--mu)" stroke-width="2"/><line x1="20" y1="30" x2="137" y2="30" stroke="${C[1]}" stroke-width="6"/><circle cx="137" cy="30" r="6" fill="var(--card)" stroke="${C[1]}" stroke-width="3"/>`+T(40,52,'−1')+T(137,52,'−1/4','middle',C[1],12)+T(170,52,'0')+T(300,52,'1')+T(78,18,'x < −1/4','middle',C[1],12)+'</svg><p class="lg">Lingkaran kosong = −1/4 sendiri tidak termasuk (tanda &lt;).</p>'},
k5b(){return sq([26],[C[0]],14,24)+'<p class="lg">26 kotak × 1,5 m (1 cm maket = 150 cm = 1,5 m asli) = 39 m. Jadi lebar maket 26 cm.</p>'},
k6b(){return pbar(1/1.1,'modal 100% = Rp250.000','10%',C[2],'jual 110% = Rp275.000 → ÷ 10 kg = Rp27.500/kg')},
k7b(){return hb([[4800,'',C[0]],[300,'',C[2]]],'total Rp5.100.000 ÷ 15 bulan = Rp340.000')+lg([[0,'pinjaman Rp4.800.000'],[2,'bunga 15 bulan Rp300.000']])},
l1(){return flow(['15','30','90'],['× 2 (balik ÷ 2)','× 3'])+'<p class="lg">Mundur dulu ke bilangan asli (30), baru dikali 3.</p>'},
l2(){const v=[12,5,10,7,9,11,8,13,6];return `<svg viewBox='0 0 156 126' width='200'>${v.map((n,i)=>`<rect x='${(i%3)*50+2}' y='${Math.floor(i/3)*40+2}' width='48' height='38' rx='4' fill='${i==8?C[3]:'none'}' fill-opacity='.35' stroke='var(--bd)' stroke-width='2'/>`+T((i%3)*50+26,Math.floor(i/3)*40+27,n,'middle',[7,9,11,8,6].includes(n)?C[1]:'var(--tx)',16)).join('')}</svg><p class='lg'>Hijau = hasil hitung (7, 9, 11, 8, 6). Semua baris, kolom, dan diagonal berjumlah 27. Kotak merah = 6.</p>`},
l3(){return ch([['3x³y',0],['−5x²y',1],['−7x²y³',2],['x³y² → tidak ada suku ini → koefisien 0',3]])},
l4(){return ch([['x²y: 3x²y − 2x²y = x²y',0],['xy: −6xy',1],['xy²: 7xy² − 7xy² = 0 (hilang)',2],['Sisa: x²y − 6xy → 2 suku',3]])},
l5(){return ch([['(3y − 2x) − (2x − 3y)',0],['= 3y − 2x − 2x + 3y',1],['= −4x + 6y → a = −4, b = 6',2],['2a + b = −8 + 6 = −2',3]])},
l6(){return area(2,-5)+'<p class="lg">Luas: x² − 5x + 2x − 10 = x² − 3x − 10 → b = −3, c = −10.</p>'},
l8(){return ch([['8x³ (A³)',0],['36x (3A²B) ← koefisien 36',1],['54/x (3AB²)',2],['27/x³ (B³)',0]])},
l9(){return ch([['Contoh: 12 = 2²·3 dan 18 = 2·3²',0],['FPB = 2·3 = 6 (pangkat kecil), KPK = 2²·3² = 36 (pangkat besar)',1],['6 × 36 = 216 = 12 × 18',2],['Jadi FPB × KPK = hasil kali dua bilangan',3]])},
l10(){return ch([['x³ + 3ax² + 3a²x + a³ = (x + a)³',0],['x² + 2ax + a² = (x + a)²',1],['(x + a)³ ÷ (x + a)² = x + a',2],['Syarat: x + a ≠ 0 → x ≠ −a',3]])},
l11(){return ch([['x⁴/16 − y⁴/81 = (x²/4)² − (y²/9)²',0],['= (x²/4 + y²/9)(x²/4 − y²/9)',1],['x²/4 − y²/9 = (x/2 + y/3)(x/2 − y/3)',2],['x²/4 + y²/9 tidak bisa difaktorkan lagi',3]])},
l12(){return area(4,7)+area(3,4)+'<p class="lg">Atas: x² + 11x + 28. Bawah: x² + 7x + 12. Selisih: 4x + 16.</p>'},
l13(){return ch([['(1/(x+5)) ÷ (1/(x−4)) = (x−4)/(x+5)',0],['1/((x+5)(x−4)) × (x+5)/(x−4)',1],['(x + 5) habis → 1/(x − 4)²',2],['Syarat: x ≠ −5 dan x ≠ 4',3]])},
m1(){return ch([['36 ÷ (−3) = −12',0],['½ × (−18) = −9',1],['−12 + (−9) = −21',2]])},
m2(){return flow(['9°','13°','17°','21°','25°','29°'],['+4','+4','+4','+4','+4'])+'<p class="lg">Naik 4°C tiap 3 menit, sebanyak 5 kali = 15 menit → 29°C.</p>'},
m3(){return ch([['43 benar × 5 = +215',1],['3 salah × (−2) = −6',3],['4 soal kosong = 0',2],['Nilai = 215 − 6 = 209',0]])},
m4(){return ch([['Beras: 59,2 + 80,8 = 140 kg → ÷ 20 = 7 kg',0],['Minyak: 69,75 + 50,25 = 120 L → ÷ 20 = 6 L',1],['Jawaban: 7 kg beras dan 6 liter minyak (B)',2]])},
m5(){return ch([['74/100 = 0,74 (terbesar)',0],['72% = 0,72',1],['0,67',2],['5/8 = 0,625 (terkecil)',3]])},
m6(){return ch([['A = {3, 5, 7, 11, 13, 17} → n(A) = 6',0],['Pilih 5 anggota = tinggalkan 1 anggota',1],['Ada 6 pilihan → 6 himpunan bagian',2]])},
m7(){return venn('9','9','14','0','Cat air','Pensil warna','S = 32')+'<p class="lg">Cat air saja 9 · keduanya 9 · pensil warna saja 14 · di luar 0. Total 32.</p>'},
m8(){return ch([['P ∩ Q = {3, 5}',0],['(P ∩ Q) ∪ R = {3, 5} ∪ {5, 7, 9, 11}',1],['= {3, 5, 7, 9, 11}',2]])},
m9(){return ch([['p = 2l − 3',0],['2(p + l) = 66 → p + l = 33',1],['(2l − 3) + l = 33 → l = 12',2],['p = 2(12) − 3 = 21',3]])},
m10(){return ch([['3x(x − 2y + 2xy) = 3x² − 6xy + 6x²y',0],['−4(x² − 4xy + 3x²y) = −4x² + 16xy − 12x²y',1],['Jumlah: −x² + 10xy − 6x²y',2]])},
m11(){return ch([['Beban = 32 × 18 = 576 hari-orang',0],['Waktu baru = 18 − 6 = 12 hari',1],['Pekerja = 576 ÷ 12 = 48 → tambah 16',2]])},
m12(){return ch([['Jarak peta = 8 + 14 = 22 cm',0],['22 × 1.200 = 26.400 cm',1],['26.400 cm = 264 m',2]])},
m13(){return hb([[15,'tepung 15',C[0]],[6,'susu 6',C[1]],[4,'mentega 4',C[2]]],'25 bagian = 1.250 g → 1 bagian = 50 g → selisih 11 bagian = 550 g')},
n1(){return ch([['−32 ÷ 4 × 8 = −8 × 8 = −64',0],['(−24 + 9) = −15',1],['−64 + (−15) = −79',2]])},
n2(){return flow(['14°','17°','20°','23°','26°','29°','32°'],['+3','+3','+3','+3','+3','+3'])+'<p class="lg">06.00 → 08.00 = 120 menit = 6 kali naik (tiap 20 menit). Setelah 08.00 tidak naik lagi, jadi 08.20 = 32°C.</p>'},
n3(){return ch([['Total = 101,25 + 98,75 = 200 kg',0],['Dijual 90% = 180 kg → sisa 20 kg',1],['Dimasak 1,25 → sisa 18,75 kg ÷ 15 = 1,25 kg',2]])},
n4(){return ch([['1/3 + 3/5 = 5/15 + 9/15 = 14/15',0],['7 ÷ 14/15 = 7 × 15/14 = 15/2',1],['1/2 − 15/2 = −7',2]])},
n5(){return ch([['M = {4, 8, 12, 16, 20, 24, 28} → n(M) = 7',0],['Himpunan bagian = 2⁷ = 128',2]])},
n6(){return venn('32','20','40','8','Basket','Bulu tangkis','S = 100')+'<p class="lg">32 + 20 + 40 + 8 = 100.</p>'},
n7(){return venn('23','15','14','8','Pantai','Kebun teh','S = 60')+'<p class="lg">Hanya pantai 23 · keduanya 15 · hanya kebun teh 14 · di luar 8. Total 60.</p>'},
n8(){return ch([['xy: 2xy + 5xy = 7xy',0],['xz: −xz − 8xz = −9xz',1],['yz: −6yz + 3yz = −3yz',2],['Hasil: 7xy − 9xz − 3yz',3]])},
n9(){return ch([['Paman = p, ayah = p − 4',0],['p + (p − 4) > 82 → 2p > 86 → p > 43',1],['Pilihan yang lebih dari 43: 44',2]])},
n10(){return ch([['Dafa = 3f + 20.000',0],['Rianggo = 5f − 10.000',1],['3f + 20.000 = 5f − 10.000 → f = 15.000',2]])},
n11(){return ch([['× 3: −9(2x + 3) + 6 ≥ 4(3x + 1)',0],['−18x − 21 ≥ 12x + 4 → −30x ≥ 25',1],['÷ (−30), tanda dibalik: x ≤ −5/6',2]])},
n12(){return ch([['Modal = 8.500.000 + 500.000 = 9.000.000',0],['Untung = 10.800.000 − 9.000.000 = 1.800.000',1],['Persen = 1.800.000 ÷ 9.000.000 × 100% = 20%',2]])},
n13(){return ch([['Tira: 1/9 per menit · Vino: 1/18 per menit',0],['Bersama: 2/18 + 1/18 = 3/18 = 1/6 per menit',1],['Waktu = 1 ÷ 1/6 = 6 menit',2]])}};
function ch(a){return '<div>'+a.map(([t,k])=>`<div style='margin:5px 0;padding:7px 12px;border-radius:8px;border-left:5px solid ${C[k]};background:var(--card);border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)'>${t}</div>`).join('')+'</div>'}
function flow(b,o){let x='';b.forEach((t,k)=>{const X=10+k*130;x+=`<rect x='${X}' y='24' width='64' height='34' rx='8' fill='none' stroke='${C[k%4]}' stroke-width='2'/>`+T(X+32,46,t,'middle','var(--tx)',15)+(k<o.length?`<line x1='${X+68}' y1='41' x2='${X+126}' y2='41' stroke='var(--mu)' stroke-width='2'/>`+T(X+97,32,o[k],'middle',C[3],10):'')});return `<svg viewBox='0 0 ${10+130*b.length} 68' width='${Math.min(130*b.length+10,420)}'>${x}</svg>`}
function area(p,q){const s=n=>n<0?'−'+-n:''+n;return `<svg viewBox='0 0 240 130' width='280'>${[[30,20,110,60,'x²',0],[140,20,70,60,s(q)+'x',1],[30,80,110,30,s(p)+'x',2],[140,80,70,30,s(p*q),3]].map(([x,y,w,h,t,k])=>`<rect x='${x}' y='${y}' width='${w}' height='${h}' fill='${C[k]}' fill-opacity='.3' stroke='${C[k]}'/>`+T(x+w/2,y+h/2+4,t,'middle','var(--tx)',13)).join('')}${T(85,14,'x')}${T(175,14,s(q))}${T(22,54,'x','end')}${T(22,100,s(p),'end')}</svg>`}
function hb(a,f){const s=a.reduce((p,x)=>p+x[0],0);let x=0,o='';a.forEach(([v,t,c])=>{const w=360*v/s;o+=`<rect x="${x}" y="6" width="${w}" height="30" rx="3" fill="${c}"/>`+T(x+w/2,26,t,'middle','#fff',11);x+=w});return `<svg viewBox="0 0 380 54" width="420">${o}${T(180,52,f,'middle','var(--mu)',10)}</svg>`}
function venn(a,ab,b,o,la,lb,s){return `<svg viewBox="0 0 330 150" width="360"><rect x="2" y="2" width="326" height="146" rx="8" fill="none" stroke="var(--bd)" stroke-width="2"/><circle cx="125" cy="75" r="55" fill="${C[0]}" fill-opacity=".35" stroke="${C[0]}" stroke-width="2"/><circle cx="205" cy="75" r="55" fill="${C[2]}" fill-opacity=".35" stroke="${C[2]}" stroke-width="2"/>${T(92,80,a,'middle','var(--tx)',12)}${T(165,80,ab,'middle','var(--tx)',12)}${T(240,80,b,'middle','var(--tx)',12)}${T(318,138,o,'end',C[3],12)}${T(92,28,la,'middle',C[0],11)}${T(240,28,lb,'middle',C[2],11)}${T(12,140,s,'start','var(--mu)',10)}</svg>`}
function sq(p,cl,w,h){let o='',x=0;p.forEach((n,k)=>{for(let i=0;i<n;i++){o+=`<rect x="${x}" y="0" width="${w-2}" height="${h}" rx="3" fill="${cl[k]}"/>`;x+=w}});return `<svg viewBox="0 0 ${x} ${h}" width="${Math.min(x,420)}">${o}</svg>`}
function pbar(f,t1,t2,c2,t3){const w=360,a=w*f;return `<svg viewBox="0 0 380 54" width="420"><rect x="0" y="6" width="${a}" height="30" rx="4" fill="${C[1]}"/><rect x="${a}" y="6" width="${w-a}" height="30" rx="4" fill="${c2}"/>${T(a/2,26,t1,'middle','#fff',12)}${T(a+(w-a)/2,26,t2,'middle','#fff',12)}${T(w/2,52,t3,'middle','var(--mu)',10)}</svg>`}
const D={bb:{t:'Bilangan Bulat',d:'Garis bilangan, KPK dan faktorisasi prima',q:[
{q:`Sebuah kapal selam berada pada kedalaman 150 m di bawah permukaan laut. Kapal naik 80 m, lalu turun 45 m. Jika kemudian naik x meter hingga berada pada kedalaman 30 m, nilai x adalah …`,o:['85 meter','75 meter','65 meter','55 meter'],a:0,il:1,
s:`Kedalaman = bilangan negatif. Posisi: −150 + 80 − 45 = <b>−115</b>. Ke −30 perlu naik 115 − 30 = <b>85 m</b>.`,
g:`<ol><li>Laut = 0, ke bawah negatif: awal <b>−150</b>.</li><li>Naik 80 → −70. Turun 45 → <b>−115</b>.</li><li>Persamaan: −115 + x = −30, jadi x = 85.</li></ol><p><b>Analogi:</b> lift basement B-115 menuju B-30: naik 85 lantai. “Naik 80, turun 45” hanya cerita jalan menuju B-115.</p><p><b>Jebakan:</b> menjawab 55 (85 − 30) karena posisi tujuan dianggap jarak.</p>`},
{q:`Tiga lampu berkedip bersamaan pukul 20.00. Merah berkedip tiap 12 detik, kuning tiap 18 detik, hijau tiap 24 detik. Pukul berapa ketiganya berkedip bersamaan untuk ketiga kalinya setelah pukul 20.00?`,o:['20.01.12','20.02.24','20.03.36','20.04.48'],a:2,il:2,
s:`Serempak tiap KPK(12, 18, 24) = <b>72 detik</b> = 1 menit 12 detik. Tiga kali: 20.01.12 → 20.02.24 → <b>20.03.36</b>.`,
g:`<ol><li>Faktorkan: 12 = 2²×3, 18 = 2×3², 24 = 2³×3.</li><li>KPK = pangkat prima terbesar: 2³×3² = <b>72</b>.</li><li>Serempak ke-1, 2, 3 = 72, 144, 216 detik → 3 menit 36 detik.</li></ol><p><b>Analogi:</b> tiga pelari 12, 18, 24 detik per putaran bertemu lagi di garis start tiap 72 detik.</p><p><b>Jebakan:</b> tertukar dengan FPB (6) atau berhenti di serempak pertama.</p><p><i>Catatan guru: opsi dan redaksi dirapikan dari soal asli yang ambigu.</i></p>`},
{q:`Suhu udara mula-mula di sebuah ruang pendingin 20°C. Mesin pendingin dihidupkan sehingga setiap 5 menit suhu udara turun 3°C. Suhu udara mencapai −4°C setelah mesin dihidupkan selama …`,o:['45 menit','40 menit','35 menit','30 menit'],a:1,il:'t1',
s:`Turun dari 20 ke −4: 20 − (−4) = <b>24°C</b>. Tiap 5 menit turun 3°C → 24 ÷ 3 = 8 kali → 8 × 5 = <b>40 menit</b>.`,
g:`<ol><li>Selisih suhu: 20 − (−4) = 24. Mengurangi bilangan negatif sama dengan menambah.</li><li>Banyak penurunan: 24 ÷ 3 = <b>8 kali</b>.</li><li>Waktu: 8 × 5 = <b>40 menit</b>.</li></ol><p><b>Analogi:</b> turun 8 anak tangga, tiap anak tangga butuh 5 menit.</p><p><b>Jebakan:</b> menghitung 20 − 4 = 16 (lupa bahwa −4 ada di bawah nol), atau berhenti di 8 kali.</p>`},
{q:`Jika n = 16 × (−15 : 3) + 24 : 8, nilai n adalah …`,o:['−80','−77','13','77'],a:1,il:'u1',
s:`Urutan: kurung dulu, lalu × ÷, terakhir +. (−15 : 3) = −5 → 16 × (−5) = −80. 24 : 8 = 3. Jadi −80 + 3 = <b>−77</b>.`,
g:`<ol><li>Kurung: −15 : 3 = −5 (negatif dibagi positif = negatif).</li><li>Kali dan bagi dari kiri: 16 × (−5) = <b>−80</b>; 24 : 8 = <b>3</b>.</li><li>Jumlahkan: −80 + 3 = <b>−77</b>.</li></ol><p><b>Jebakan:</b> berhenti di −80 (lupa + 24 : 8), atau salah tanda sehingga muncul 77.</p>`},
{q:`Operasi “#” berarti bagilah bilangan pertama dengan −3 kemudian tambahkan hasilnya dengan bilangan setengah dari bilangan kedua. Hasil operasi 36 # −18 adalah …`,o:['21','3','−21','−27'],a:2,il:'m1',
s:`36 ÷ (−3) = −12. Setengah dari −18 = −9. Jumlah: −12 + (−9) = <b>−21</b>.`,
g:`<ol><li>Ikuti perintah berurutan: bagi bilangan pertama dengan −3 → −12.</li><li>Setengah bilangan kedua: −18 ÷ 2 = −9.</li><li>Jumlahkan: −12 + (−9) = <b>−21</b>.</li></ol><p><b>Jebakan:</b> lupa bahwa positif ÷ negatif = negatif (36 ÷ −3 = +12) sehingga hasilnya 3 (opsi B).</p>`},
{q:`Tia mengeluarkan es krim dari dalam kulkas. Suhu es krim mula-mula 9°C. Perlahan-lahan suhu es krim naik sebesar 4°C setiap 3 menit. Suhu es krim setelah 15 menit adalah …`,o:['20°C','25°C','29°C','34°C'],a:2,il:'m2',
s:`15 ÷ 3 = 5 kali naik. Kenaikan 5 × 4 = 20°C. Suhu akhir 9 + 20 = <b>29°C</b>.`,
g:`<ol><li>Banyak kenaikan: 15 menit ÷ 3 menit = <b>5 kali</b>.</li><li>Total naik: 5 × 4 = 20°C.</li><li>Suhu akhir: 9 + 20 = <b>29°C</b>.</li></ol><p><b>Jebakan:</b> menjawab 20°C (hanya kenaikan, lupa suhu awal).</p>`},
{q:`Wulan mengikuti tes 50 soal. Skor 5 untuk jawaban benar, skor −2 untuk jawaban salah, dan skor 0 untuk soal yang tidak dijawab. Wulan menjawab 46 soal, dan di antaranya 3 soal dijawab salah. Nilai Wulan adalah …`,o:['209','212','215','230'],a:0,il:'m3',
s:`Benar = 46 − 3 = 43 soal → 43 × 5 = 215. Salah: 3 × (−2) = −6. Nilai = 215 − 6 = <b>209</b>.`,
g:`<ol><li>Soal benar: 46 − 3 = 43. Soal kosong: 50 − 46 = 4 (skor 0).</li><li>43 × 5 = 215 dan 3 × (−2) = −6.</li><li>215 + (−6) = <b>209</b>.</li></ol><p><b>Jebakan:</b> mengalikan semua soal terjawab dengan 5 (230) atau lupa mengurangi skor salah (215).</p>`},
{q:`Hasil dari −32 : 4 × 8 + (−24 + 9) adalah …`,o:['−89','−79','−47','−16'],a:1,il:'n1',
s:`Urutan: kurung, lalu ÷ × dari kiri, lalu +. (−24 + 9) = −15. −32 : 4 = −8, lalu −8 × 8 = −64. Jumlah: −64 + (−15) = <b>−79</b>.`,
g:`<ol><li>Kurung dulu: −24 + 9 = <b>−15</b>.</li><li>÷ dan × dari kiri: −32 : 4 = −8 → −8 × 8 = <b>−64</b>.</li><li>−64 + (−15) = <b>−79</b>.</li></ol><p><b>Jebakan:</b> mengalikan 4 × 8 lebih dulu (−32 : 32 = −1) sehingga hasilnya −16.</p>`},
{q:`Pada pukul 06.00 suhu udara di sebuah kota adalah 14°C. Setiap 20 menit suhu udara naik 3°C. Setelah pukul 08.00 suhu udara tidak naik lagi. Suhu udara pada pukul 08.20 adalah …`,o:['26°C','29°C','32°C','35°C'],a:2,il:'n2',
s:`06.00–08.00 = 120 menit → 120 ÷ 20 = 6 kali naik → +18°C. Setelah 08.00 tidak naik lagi. Suhu 08.20 = 14 + 18 = <b>32°C</b>.`,
g:`<ol><li>Lama kenaikan: 06.00 sampai 08.00 = 120 menit.</li><li>120 ÷ 20 = <b>6 kali</b> naik → 6 × 3 = 18°C.</li><li>Suhu berhenti naik pukul 08.00, jadi 08.20 tetap 14 + 18 = <b>32°C</b>.</li></ol><p><b>Jebakan:</b> menghitung 7 kali sampai 08.20 sehingga muncul 35°C.</p>`}]},
pc:{t:'Pecahan',d:'Pecahan bersusun dan desimal',q:[
{q:`Hasil dari (3/5 − 1/10) ÷ (2/5 + 3/10) adalah …`,o:['2/7','2/5','5/7','5/8'],a:2,il:'p2',
s:`Atas: 3/5 − 1/10 = 6/10 − 1/10 = 5/10. Bawah: 2/5 + 3/10 = 4/10 + 3/10 = 7/10. Hasil: 5/10 ÷ 7/10 = <b>5/7</b>.`,
g:`<ol><li>Samakan penyebut menjadi 10 (KPK 5 dan 10).</li><li>Atas = 5/10, bawah = 7/10.</li><li>Pecahan bersusun = atas ÷ bawah. Penyebut sama, jadi tinggal 5 ÷ 7 = <b>5/7</b>.</li></ol><p><b>Jebakan:</b> mengurangkan pembilang dan penyebut langsung (3 − 1)/(5 − 10), atau lupa menyamakan penyebut.</p><p><i>Catatan guru: cetakan soal di foto buram. Tanda operasi (− di atas, + di bawah) disimpulkan dari opsi: hanya kombinasi ini yang hasilnya ada di pilihan.</i></p>`},
{q:`Sekelompok siswa mengadakan bakti sosial. Mereka menerima 3 karung beras berturut-turut berisi 56,75 kg, 80½ kg, dan 90¼ kg. Beras tersebut akan disumbangkan kepada sejumlah kepala keluarga secara merata. Jika setiap kepala keluarga menerima beras 3,5 kg, kepala keluarga yang menerima sumbangan sebanyak …`,o:['65 orang','70 orang','72 orang','75 orang'],a:0,il:'p3',
s:`80½ = 80,5 dan 90¼ = 90,25. Total = 56,75 + 80,5 + 90,25 = 227,5 kg. Dibagi 3,5 kg per orang: 227,5 ÷ 3,5 = <b>65 orang</b>.`,
g:`<ol><li>Ubah pecahan campuran ke desimal: ½ = 0,5 dan ¼ = 0,25.</li><li>Jumlahkan: 56,75 + 80,5 + 90,25 = <b>227,5</b>.</li><li>Bagi rata: 227,5 ÷ 3,5 = <b>65</b>. Cek: 65 × 3,5 = 227,5.</li></ol><p><b>Jebakan:</b> mengubah ¼ menjadi 0,4 (seharusnya 0,25), atau menjumlah angka bulatnya saja.</p>`},
{q:`Organisasi sosial menyediakan 2 karung beras masing-masing berisi 59,2 kg dan 80⅘ kg, serta 2 drum minyak goreng masing-masing berisi 69¾ liter dan 50,25 liter. Beras dan minyak dikemas ulang dan dibagikan merata kepada 20 kepala keluarga. Pernyataan yang benar adalah …`,o:['Setiap keluarga menerima 7 kg beras dan 5 liter minyak','Setiap keluarga menerima 7 kg beras dan 6 liter minyak','Setiap keluarga menerima 6 kg beras dan 5 liter minyak','Setiap keluarga menerima 6 kg beras dan 7 liter minyak'],a:1,il:'m4',
s:`Beras: 59,2 + 80,8 = 140 kg ÷ 20 = 7 kg. Minyak: 69,75 + 50,25 = 120 L ÷ 20 = <b>6 L</b>. Jawaban B.`,
g:`<ol><li>Ubah pecahan ke desimal: 80⅘ = 80,8 dan 69¾ = 69,75.</li><li>Total beras 140 kg, total minyak 120 liter.</li><li>Bagi 20 keluarga: 7 kg beras dan 6 liter minyak.</li></ol><p><b>Jebakan:</b> salah mengubah ⅘ (0,8) atau ¾ (0,75) ke desimal.</p>`},
{q:`Diketahui pecahan 72%; 5/8; 0,67; dan 74/100. Urutan pecahan dari yang nilainya terbesar adalah …`,o:['74/100; 72%; 0,67; dan 5/8','74/100; 72%; 5/8; dan 0,67','0,67; 5/8; 74/100; dan 72%','5/8; 0,67; 72%; dan 74/100'],a:0,il:'m5',
s:`Samakan ke desimal: 74/100 = 0,74; 72% = 0,72; 0,67; 5/8 = 0,625. Terbesar ke terkecil: <b>74/100; 72%; 0,67; 5/8</b>.`,
g:`<ol><li>Pecahan, persen, dan desimal harus disamakan bentuknya dulu.</li><li>5/8 = 5 ÷ 8 = 0,625; 72% = 72/100 = 0,72.</li><li>Urutkan: 0,74 &gt; 0,72 &gt; 0,67 &gt; 0,625.</li></ol><p><b>Jebakan:</b> membandingkan angka tanpa mengubah bentuk, misalnya mengira 5/8 lebih besar dari 0,67.</p>`},
{q:`Pak Nanang memanen ikan dari dua kolam. Kolam pertama menghasilkan 101,25 kg, kolam kedua 98¾ kg. Sebanyak 90% dari hasil ikan tersebut dijual. Sebanyak 1¼ kg dimasak, sedangkan sisanya diberikan kepada 15 tetangga sama banyak. Setiap tetangga memperoleh ikan sebanyak …`,o:['¼ kg','¾ kg','1 kg','1¼ kg'],a:3,il:'n3',
s:`Total 101,25 + 98,75 = 200 kg. Dijual 90% = 180 kg, sisa 20 kg. Dimasak 1,25 kg → sisa 18,75 kg. 18,75 ÷ 15 = <b>1,25 kg = 1¼ kg</b>.`,
g:`<ol><li>98¾ = 98,75 → total 200 kg.</li><li>Sisa setelah dijual: 10% × 200 = 20 kg. Dikurangi yang dimasak: 20 − 1,25 = 18,75 kg.</li><li>Bagi 15 tetangga: 18,75 ÷ 15 = <b>1,25</b> kg.</li></ol><p><b>Jebakan:</b> lupa mengurangi ikan yang dimasak (20 ÷ 15) atau memakai 90% sebagai sisa.</p>`},
{q:`Hasil dari 1/2 − 7/(1/3 + 3/5) adalah …`,o:['8','−1','−7','−8'],a:2,il:'n4',
s:`1/3 + 3/5 = 5/15 + 9/15 = 14/15. 7 ÷ 14/15 = 7 × 15/14 = 15/2. Lalu 1/2 − 15/2 = −14/2 = <b>−7</b>.`,
g:`<ol><li>Kerjakan penyebut bersusun dulu: 1/3 + 3/5 = <b>14/15</b>.</li><li>Pembagian = kali kebalikan: 7 × 15/14 = 15/2.</li><li>1/2 − 15/2 = <b>−7</b>.</li></ol><p><b>Jebakan:</b> membagi 7 dengan 1/3 + 3/5 tanpa menyamakan penyebut.</p><p><i>Catatan guru: cetakan soal di foto kecil; bentuk soal dibaca sebagai 1/2 − 7/(1/3 + 3/5). Cocokkan dengan buku.</i></p>`}]},
hm:{t:'Himpunan',d:'Himpunan bagian dan diagram Venn',q:[
{q:`Diketahui P = {himpunan huruf vokal}. Banyak himpunan bagian dari P yang memiliki 2 anggota adalah …`,o:['5','10','12','15'],a:1,il:'h13',
s:`P = {a, i, u, e, o} (5 anggota). Memilih 2 dari 5 tanpa memedulikan urutan: 5 × 4 ÷ 2 = <b>10</b>.`,
g:`<ol><li>Vokal ada 5, jadi n(P) = 5.</li><li>Himpunan bagian 2 anggota = pasangan tanpa urutan: {a, i} sama dengan {i, a}.</li><li>5 × 4 = 20, dibagi 2 → <b>10</b>.</li></ol><p><b>Jebakan:</b> menjawab 5 (banyak anggota), 20 (urutan dihitung), atau 32 (semua himpunan bagian, 2⁵).</p>`},
{q:`Dalam sebuah kelas terdapat 35 siswa. Sebanyak 15 siswa menyukai Matematika dan 22 siswa menyukai Bahasa Inggris. Jika 5 siswa menyukai keduanya, banyak siswa yang tidak menyukai Matematika maupun Bahasa Inggris adalah …`,o:['3 orang','5 orang','8 orang','10 orang'],a:0,il:'h14',
s:`Gabungan = 15 + 22 − 5 = 32 (yang suka keduanya dihitung sekali). Tidak suka keduanya = 35 − 32 = <b>3 orang</b>.`,
g:`<ol><li>Hanya Matematika: 15 − 5 = 10. Hanya Inggris: 22 − 5 = 17.</li><li>Di dalam lingkaran: 10 + 5 + 17 = 32.</li><li>Di luar lingkaran: 35 − 32 = <b>3</b>.</li></ol><p><b>Jebakan:</b> 15 + 22 = 37 (orang yang suka keduanya terhitung dua kali) sehingga hasilnya negatif.</p>`},
{q:`Perhatikan diagram Venn dengan S = {0, 1, 2, …, 12}, A = {3, 4, 6, 7, 9, 12}, dan B = {1, 4, 5, 7, 8, 10}.<br>Pernyataan: (i) A<sup>c</sup> = {1, 4, 5, 7, 8, 10}; (ii) A ∩ B = {4, 7}; (iii) A − B = {3, 6, 9, 12}; (iv) A ∪ B = {1, 3, 5, 6, 8, 9, 10, 12}; (v) (A ∪ B)<sup>c</sup> = {0, 2, 11}.<br>Pernyataan yang benar ditunjukkan oleh …`,o:['i, ii, dan iii','i, ii, dan v','ii, iii, dan v','ii, iii, dan iv'],a:2,il:'v13',
s:`Cek tiap pernyataan di diagram: (ii) irisan {4, 7} ✔, (iii) hanya A {3, 6, 9, 12} ✔, (v) di luar lingkaran {0, 2, 11} ✔. (i) dan (iv) salah → <b>ii, iii, dan v</b>.`,
g:`<ol><li>Irisan A ∩ B = bagian yang bertumpuk: <b>{4, 7}</b> → (ii) benar.</li><li>A − B = hanya di A: <b>{3, 6, 9, 12}</b> → (iii) benar.</li><li>(A ∪ B)<sup>c</sup> = di luar kedua lingkaran: <b>{0, 2, 11}</b> → (v) benar.</li><li>(i) salah: A<sup>c</sup> adalah semua yang di luar A = {0, 1, 2, 5, 8, 10, 11}. (iv) salah: A ∪ B harus memuat 4 dan 7.</li></ol><p><b>Jebakan:</b> mengira A<sup>c</sup> hanya isi B, atau lupa angka di irisan ikut masuk gabungan.</p>`},
{q:`Kinan mewawancarai 30 orang teman di sekolahnya. Dari hasil wawancara terdapat 3 orang gemar menari dan menyanyi. Perbandingan banyak orang yang gemar menari dengan orang yang gemar menyanyi adalah 3 : 4. Jika sebanyak 5 orang tidak gemar menari maupun menyanyi, banyak orang yang hanya gemar menyanyi adalah …`,o:['4 orang','7 orang','11 orang','13 orang'],a:3,il:'v14',
s:`Yang gemar salah satu atau keduanya = 30 − 5 = 25. Menari + menyanyi = 25 + 3 = 28 (irisan terhitung dua kali). 28 ÷ 7 = 4 → menyanyi = 4 × 4 = 16. Hanya menyanyi = 16 − 3 = <b>13 orang</b>.`,
g:`<ol><li>Gabungan = 30 − 5 = <b>25</b>.</li><li>Gabungan = menari + menyanyi − irisan → menari + menyanyi = 25 + 3 = <b>28</b>.</li><li>Rasio 3 : 4 = 7 bagian → 1 bagian = 4: menari 12, menyanyi 16.</li><li>Hanya menyanyi = 16 − 3 = <b>13</b>.</li></ol><p><b>Jebakan:</b> berhenti di 16 (belum dikurangi yang gemar keduanya) atau memakai rasio langsung pada 25.</p>`},
{q:`Diketahui himpunan A = {x | 2 < x ≤ 17, x bilangan prima}. Himpunan bagian dari A yang memiliki 5 anggota sebanyak …`,o:['6','10','15','20'],a:0,il:'m6',
s:`A = {3, 5, 7, 11, 13, 17} → 6 anggota. Memilih 5 dari 6 sama dengan membuang 1 anggota → <b>6</b> cara.`,
g:`<ol><li>Syarat 2 &lt; x berarti 2 <b>tidak</b> masuk; 17 masuk.</li><li>Prima: 3, 5, 7, 11, 13, 17 → n(A) = 6.</li><li>Memilih 5 dari 6 = memilih 1 yang ditinggalkan = <b>6</b>.</li></ol><p><b>Jebakan:</b> memasukkan 2 sehingga n(A) = 7 dan hasilnya 21.</p>`},
{q:`Di kelas IXB terdapat 32 siswa. Semua siswa membawa minimal salah satu cat air atau pensil warna. Sebanyak 18 siswa membawa cat air dan 9 siswa membawa keduanya. Banyak siswa yang hanya membawa pensil warna adalah …`,o:['9 orang','14 orang','17 orang','23 orang'],a:1,il:'m7',
s:`Semua siswa membawa minimal satu. Yang tidak membawa cat air = 32 − 18 = 14, berarti mereka hanya membawa pensil warna → <b>14 orang</b>.`,
g:`<ol><li>Tidak ada siswa di luar lingkaran (semua membawa minimal satu).</li><li>Hanya cat air: 18 − 9 = 9. Keduanya: 9.</li><li>Hanya pensil warna: 32 − 9 − 9 = <b>14</b>.</li></ol><p><b>Jebakan:</b> mengurangkan 9 dari 18 lalu menjawab 9.</p>`},
{q:`Diketahui himpunan P = {3, 4, 5, 6}, Q = {2, 3, 5, 7, 11}, dan R = {5, 7, 9, 11}. Hasil (P ∩ Q) ∪ R adalah …`,o:['{3}','{3, 5, 7}','{2, 3, 5, 7, 9}','{3, 5, 7, 9, 11}'],a:3,il:'m8',
s:`P ∩ Q = {3, 5}. Gabungkan dengan R: {3, 5} ∪ {5, 7, 9, 11} = <b>{3, 5, 7, 9, 11}</b>.`,
g:`<ol><li>Kerjakan kurung dulu: irisan P dan Q = anggota yang ada di keduanya = {3, 5}.</li><li>Gabungan dengan R: semua anggota dari {3, 5} dan R, anggota sama ditulis sekali.</li><li>Hasil: {3, 5, 7, 9, 11}.</li></ol><p><b>Jebakan:</b> mengabaikan kurung dan mengerjakan Q ∪ R lebih dulu.</p>`},
{q:`Diketahui himpunan M = {himpunan bilangan kelipatan 4 kurang dari 32}. Banyaknya himpunan bagian dari M adalah …`,o:['49','64','128','256'],a:2,il:'n5',
s:`M = {4, 8, 12, 16, 20, 24, 28} → 7 anggota. Banyak himpunan bagian = 2⁷ = <b>128</b>.`,
g:`<ol><li>Kelipatan 4 yang <b>kurang dari</b> 32: 4 sampai 28 → n(M) = 7.</li><li>Banyak himpunan bagian = 2<sup>n</sup> = 2⁷ = <b>128</b>.</li></ol><p><b>Jebakan:</b> memasukkan 32 (n = 8) sehingga hasilnya 256.</p>`},
{q:`Dari 100 siswa yang mengikuti ekstrakurikuler, terdapat 52 siswa mengikuti basket dan 60 siswa mengikuti bulu tangkis. Jika 20 siswa mengikuti keduanya, banyak siswa yang tidak mengikuti basket maupun bulu tangkis adalah …`,o:['4 orang','8 orang','10 orang','12 orang'],a:1,il:'n6',
s:`Gabungan = 52 + 60 − 20 = 92. Di luar = 100 − 92 = <b>8 orang</b>.`,
g:`<ol><li>Hanya basket 52 − 20 = 32; hanya bulu tangkis 60 − 20 = 40.</li><li>Di dalam lingkaran: 32 + 20 + 40 = 92.</li><li>Di luar: 100 − 92 = <b>8</b>.</li></ol><p><b>Jebakan:</b> 52 + 60 = 112 (irisan terhitung dua kali), sehingga hasilnya negatif.</p>`},
{q:`Sebanyak 60 orang diwawancarai tentang tempat wisata yang pernah dikunjungi. Orang yang pernah ke pantai ada 38 orang, sedangkan 29 orang pernah ke kebun teh. Orang yang belum pernah ke pantai maupun kebun teh sebanyak 8 orang. Banyak orang yang hanya pernah berkunjung ke pantai adalah …`,o:['12 orang','17 orang','20 orang','23 orang'],a:3,il:'n7',
s:`Pernah ke minimal satu tempat = 60 − 8 = 52. Keduanya = 38 + 29 − 52 = 15. Hanya pantai = 38 − 15 = <b>23 orang</b>.`,
g:`<ol><li>Gabungan = 60 − 8 = <b>52</b>.</li><li>Irisan = n(A) + n(B) − n(A ∪ B) = 38 + 29 − 52 = <b>15</b>.</li><li>Hanya pantai = 38 − 15 = <b>23</b>.</li></ol><p><b>Jebakan:</b> menjawab 17 (60 − 38 − ...) atau menganggap irisan = 0.</p>`}]},
aj:{t:'Aljabar',d:'Bentuk aljabar, persamaan, hingga pemfaktoran',q:[
{q:`Penyelesaian persamaan −3(2x − 5) + 11 = 2(5x + 7) − 4 adalah p. Nilai 2p − 5 adalah …`,o:['−7','−3','1','7'],a:1,il:'a12',
s:`Kiri: −6x + 15 + 11 = −6x + 26. Kanan: 10x + 14 − 4 = 10x + 10. Maka 16 = 16x → x = 1 = p. Nilai 2(1) − 5 = <b>−3</b>.`,
g:`<ol><li>Kalikan ke dalam kurung. Hati-hati: −3 × (−5) = <b>+15</b>.</li><li>Gabungkan: kiri −6x + 26, kanan 10x + 10.</li><li>Pindah ruas: 26 − 10 = 10x + 6x → 16 = 16x → x = 1.</li><li>Pertanyaan meminta 2p − 5, bukan p: 2 − 5 = <b>−3</b>.</li></ol><p><b>Jebakan:</b> salah tanda −3 × (−5), atau berhenti di p = 1 (opsi C).</p>`},
{q:`Himpunan penyelesaian 5(x − 5) + 31 < (1/3)(2 − x) + 4 adalah …`,o:['{x | x < 1/2, x ∈ R}','{x | x < −1/4, x ∈ R}','{x | x < −1/3, x ∈ R}','{x | x < −1/2, x ∈ R}'],a:1,il:'a12b',
s:`Kalikan kedua ruas dengan 3 agar pecahan hilang: 15(x − 5) + 93 < (2 − x) + 12 → 15x + 18 < 14 − x → 16x < −4 → x < <b>−1/4</b>.`,
g:`<ol><li>Kalikan <b>semua suku</b> dengan 3 (termasuk 31 dan 4): 15(x − 5) + 93 < 2 − x + 12.</li><li>Sederhanakan: 15x + 18 < 14 − x.</li><li>Pindah ruas: 15x + x < 14 − 18 → 16x < −4 → x < −1/4.</li></ol><p><b>Analogi:</b> pertidaksamaan seperti neraca yang boleh dikali atau dibagi bilangan positif tanpa membalik tanda. Tanda baru dibalik jika dikali atau dibagi bilangan negatif.</p><p><b>Jebakan:</b> mengalikan 3 hanya pada pecahan, sehingga 31 dan 4 terlewat.</p>`},
{q:`Jika suatu bilangan dibagi dengan 2, maka menghasilkan bilangan 15. Jika bilangan tersebut dikali dengan 3, maka menghasilkan bilangan …`,o:['30','45','60','90'],a:3,il:'l1',
s:`Misal bilangannya n: n ÷ 2 = 15 → n = 15 × 2 = 30. Dikali 3: 30 × 3 = <b>90</b>.`,
g:`<ol><li>Model: n ÷ 2 = 15.</li><li>Lawan dari ÷ 2 adalah × 2: n = 15 × 2 = <b>30</b>.</li><li>Soal meminta n × 3 = 30 × 3 = <b>90</b>.</li></ol><p><b>Jebakan:</b> menjawab 45 (15 × 3), padahal 15 bukan bilangan aslinya.</p>`},
{q:`Perhatikan persegi ajaib 3 × 3: baris atas 12, 5, 10; baris bawah: (kosong), 13, (kotak merah); baris tengah kosong. Jika jumlah bilangan pada setiap baris, kolom, dan diagonal sama, bilangan untuk kotak merah (kanan bawah) adalah …`,o:['6','9','11','14'],a:0,il:'l2',
s:`Jumlah baris atas = 12 + 5 + 10 = 27. Kolom tengah: 5 + t + 13 = 27 → t = 9. Diagonal: 12 + 9 + merah = 27 → merah = <b>6</b>.`,
g:`<ol><li>Jumlah ajaib = 12 + 5 + 10 = <b>27</b>.</li><li>Kolom tengah: 5 + t + 13 = 27 → t = 9 (kotak tengah).</li><li>Diagonal kiri atas ke kanan bawah: 12 + 9 + m = 27 → m = <b>6</b>.</li></ol><p><b>Cek:</b> diagonal lain 10 + 9 + 8 = 27 (kotak ungu = 8), baris bawah 8 + 13 + 6 = 27.</p><p><b>Jebakan:</b> menjawab 9 (isi kotak tengah, bukan kotak merah).</p>`},
{q:`Dari bentuk aljabar 3x³y − 5x²y − 7x²y³, yang merupakan koefisien dari x³y² adalah …`,o:['3','0','−5','−7'],a:1,il:'l3',
s:`Cari suku x³y². Suku yang ada: 3x³y, −5x²y, −7x²y³. Tidak ada yang persis x³y², jadi koefisiennya <b>0</b>.`,
g:`<ol><li>Koefisien adalah angka di depan variabel yang <b>persis sama</b> (pangkat x dan y sama).</li><li>3x³y berbeda (y berpangkat 1); −5x²y dan −7x²y³ juga berbeda.</li><li>Tidak ada suku sejenis → koefisien <b>0</b>.</li></ol><p><b>Jebakan:</b> memilih 3 karena mirip x³y.</p><p><i>Catatan guru: kunci dihitung dari soal; bila soal aslinya x³y, jawabannya 3.</i></p>`},
{q:`Bentuk aljabar 3x²y − 6xy + 7xy² − 2x²y − 7xy² merupakan bentuk aljabar …`,o:['suku dua','suku tiga','suku empat','suku lima'],a:0,il:'l4',
s:`Gabungkan suku sejenis: 3x²y − 2x²y = x²y; 7xy² − 7xy² = 0. Sisa x²y − 6xy, yaitu <b>suku dua</b>.`,
g:`<ol><li>Kelompokkan suku sejenis (variabel dan pangkat sama).</li><li>x²y: 3 − 2 = 1. xy²: 7 − 7 = 0 (hilang). xy: −6.</li><li>Tersisa x²y − 6xy → <b>2 suku</b>.</li></ol><p><b>Jebakan:</b> menghitung 5 suku dari soal tanpa menyederhanakan dahulu.</p>`},
{q:`Jika a dan b masing-masing merupakan koefisien x dan y dari hasil pengurangan 2x − 3y dari 3y − 2x, maka 2a + b = …`,o:['−8','−2','2','8'],a:1,il:'l5',
s:`“2x − 3y dari 3y − 2x” = (3y − 2x) − (2x − 3y) = −4x + 6y. Jadi a = −4, b = 6 → 2a + b = −8 + 6 = <b>−2</b>.`,
g:`<ol><li>“A dari B” berarti <b>B − A</b>: (3y − 2x) − (2x − 3y).</li><li>Buka kurung (tanda minus membalik isinya): 3y − 2x − 2x + 3y = −4x + 6y.</li><li>a = −4, b = 6 → 2(−4) + 6 = <b>−2</b>.</li></ol><p><b>Jebakan:</b> urutan terbalik (2x − 3y) − (3y − 2x) = 4x − 6y, hasilnya 2.</p>`},
{q:`(x + 4)(x + 7) − (3 + x)(4 + x) = …`,o:['4x + 16','4x² + 16x','4x − 16','4x² − 16x'],a:0,il:'l12',
s:`(x+4)(x+7) = x² + 11x + 28. (3+x)(4+x) = x² + 7x + 12. Selisihnya: <b>4x + 16</b>.`,
g:`<ol><li>Jabarkan pertama: x² + 7x + 4x + 28 = x² + 11x + 28.</li><li>Jabarkan kedua: x² + 4x + 3x + 12 = x² + 7x + 12.</li><li>Kurangkan: x² habis, 11x − 7x = 4x, 28 − 12 = 16 → <b>4x + 16</b>.</li></ol><p><b>Jebakan:</b> lupa bahwa x² di kedua bentuk saling menghabiskan, sehingga hasil masih ber-x².</p>`},
{q:`Jika (x + 2)(x − 5) = x² + bx + c, maka hasil dari (x + b)(x − c) adalah …`,o:['x² + 13x + 30','x² − 13x + 30','x² + 7x − 30','x² − 7x − 30'],a:2,il:'l6',
s:`(x+2)(x−5) = x² − 3x − 10 → b = −3, c = −10. Maka (x − 3)(x + 10) = <b>x² + 7x − 30</b>.`,
g:`<ol><li>Jabarkan: x² − 5x + 2x − 10 = x² − 3x − 10.</li><li>Samakan bentuknya: b = <b>−3</b>, c = <b>−10</b>.</li><li>(x + b)(x − c) = (x − 3)(x + 10) = x² + 10x − 3x − 30 = <b>x² + 7x − 30</b>.</li></ol><p><b>Jebakan:</b> lupa bahwa c negatif sehingga x − c menjadi x + 10.</p>`},
{q:`Pemfaktoran dari x⁴/16 − y⁴/81 adalah …`,o:['(x²/4 + y²/9)(x/2 − y/3)(x/2 − y/3)','(x/2 + y/3)²(x/2 − y/3)(x/2 + y/3)','(x²/4 + y²/9)(x²/4 − y²/9)(x/2 − y/3)','(x²/4 + y²/9)(x/2 + y/3)(x/2 − y/3)'],a:3,il:'l11',
s:`Selisih kuadrat dua kali: (x²/4)² − (y²/9)² = (x²/4 + y²/9)(x²/4 − y²/9), lalu x²/4 − y²/9 = (x/2 + y/3)(x/2 − y/3). Jawaban <b>D</b>.`,
g:`<ol><li>a² − b² = (a + b)(a − b), dengan a = x²/4 dan b = y²/9.</li><li>Faktor x²/4 − y²/9 masih selisih kuadrat: (x/2)² − (y/3)².</li><li>Pemfaktoran lengkap punya tiga faktor. x²/4 + y²/9 (jumlah kuadrat) tidak bisa dipecah lagi.</li></ol><p><b>Jebakan:</b> berhenti di dua faktor (opsi C belum tuntas) atau memakai tanda yang sama pada dua faktor terakhir.</p>`},
{q:`Hasil dari (x³ + 3ax² + 3a²x + a³) ÷ (x² + 2ax + a²) adalah …`,o:['x − a dengan x ≠ a','x + a dengan x ≠ −a','x² − a² dengan x ≠ ±a','x² dengan x ≠ 0'],a:1,il:'l10',
s:`Pembilang = (x + a)³, penyebut = (x + a)². (x+a)³ ÷ (x+a)² = <b>x + a</b>, dengan syarat x + a ≠ 0, yaitu x ≠ −a.`,
g:`<ol><li>Kenali pola kubus: x³ + 3ax² + 3a²x + a³ = (x + a)³.</li><li>Pola kuadrat: x² + 2ax + a² = (x + a)².</li><li>(x + a)³ ÷ (x + a)² = x + a. Pembagi tidak boleh nol → <b>x ≠ −a</b>.</li></ol><p><b>Jebakan:</b> lupa menuliskan syarat x ≠ −a.</p>`},
{q:`Diketahui m dan n adalah dua bilangan bulat positif berbeda. Hasil kali FPB dan KPK dari a<sup>m</sup>b<sup>n</sup>c<sup>3</sup> dan a<sup>n</sup>b<sup>m</sup>c<sup>2</sup> adalah …`,o:['a<sup>m+n</sup>b<sup>m+n</sup>c<sup>5</sup>','a<sup>2m</sup>b<sup>2m</sup>c<sup>5</sup>','a<sup>2n</sup>b<sup>2n</sup>c<sup>5</sup>','a<sup>m−n</sup>b<sup>n−m</sup>c<sup>5</sup>'],a:0,il:'l9',
s:`FPB × KPK dua bentuk = hasil kali keduanya. Kalikan: a<sup>m+n</sup> · b<sup>n+m</sup> · c<sup>3+2</sup> = <b>a<sup>m+n</sup>b<sup>m+n</sup>c<sup>5</sup></b>.`,
g:`<ol><li>Sifat: FPB(p, q) × KPK(p, q) = p × q. Contoh: 12 dan 18 → 6 × 36 = 216 = 12 × 18.</li><li>Kalikan kedua bentuk: pangkat variabel sama dijumlahkan. a: m + n, b: n + m, c: 3 + 2 = 5.</li></ol><p><b>Jebakan:</b> mencari FPB dan KPK satu per satu. Karena m dan n berbeda, cara ini membingungkan; sifat di atas jauh lebih cepat.</p>`},
{q:`Hasil dari 1/((x + 5)(x − 4)) ÷ ( 1/(x + 5) ÷ 1/(x − 4) ) adalah …`,o:['1 dengan x ≠ −5 dan x ≠ 4','1/(x + 5)² dengan x ≠ −5 dan x ≠ 4','1/(x − 4)² dengan x ≠ −5 dan x ≠ 4','1/((x + 5)²(x − 4)²) dengan x ≠ −5 dan x ≠ 4'],a:2,il:'l13',
s:`Kurung dulu: (1/(x+5)) ÷ (1/(x−4)) = (x−4)/(x+5). Lalu 1/((x+5)(x−4)) × (x+5)/(x−4) = <b>1/(x−4)²</b>.`,
g:`<ol><li>Bagi pecahan = kali kebalikan: 1/(x+5) × (x−4)/1 = (x−4)/(x+5).</li><li>Bagi lagi: 1/((x+5)(x−4)) × (x+5)/(x−4).</li><li>(x + 5) habis, tersisa 1/(x − 4)². Penyebut tidak boleh nol: x ≠ −5 dan x ≠ 4.</li></ol><p><b>Jebakan:</b> membalik pecahan yang salah, sehingga faktor (x − 4) hanya muncul sekali.</p>`},
{q:`Koefisien x pada hasil penjabaran (2x + 3/x)³ adalah …`,o:['12','18','36','54'],a:2,il:'l8',
s:`Suku x muncul dari 3 · (2x)² · (3/x) = 3 · 4x² · 3/x = <b>36x</b>. Koefisiennya 36.`,
g:`<ol><li>Pola (A + B)³ = A³ + 3A²B + 3AB² + B³ dengan A = 2x dan B = 3/x.</li><li>Tiap suku: 8x³, 36x, 54/x, 27/x³.</li><li>Hanya 3A²B yang berpangkat x¹ → koefisien <b>36</b>.</li></ol><p><b>Jebakan:</b> memilih 54, yaitu suku 3AB² yang berpangkat x⁻¹.</p>`},
{q:`Pak Lukman mempunyai kebun berbentuk persegi panjang. Panjang kebun 3 meter kurang dari dua kali lebarnya. Jika panjang pagar yang mengelilingi kebun 66 meter, panjang kebun adalah …`,o:['18 meter','21 meter','24 meter','27 meter'],a:1,il:'m9',
s:`Misal lebar l, panjang p = 2l − 3. Keliling 2(p + l) = 66 → p + l = 33 → 3l − 3 = 33 → l = 12. Panjang = <b>21 m</b>.`,
g:`<ol><li>Terjemahkan kalimat: p = 2l − 3.</li><li>Keliling = 2(p + l) = 66 → p + l = 33.</li><li>Substitusi: 3l − 3 = 33 → l = 12 → p = 2(12) − 3 = <b>21</b>.</li></ol><p><b>Jebakan:</b> menjawab 12 (lebar) atau memakai 66 sebagai p + l.</p>`},
{q:`Hasil dari 3x(x − 2y + 2xy) − 4(x² − 4xy + 3x²y) adalah …`,o:['−x² + 22xy + 6x²y','−x² + 22xy − 6x²y','−x² + 10xy + 6x²y','−x² + 10xy − 6x²y'],a:3,il:'m10',
s:`3x² − 6xy + 6x²y − 4x² + 16xy − 12x²y. Gabungkan sejenis: x²: −1; xy: 10; x²y: −6 → <b>−x² + 10xy − 6x²y</b>.`,
g:`<ol><li>Distributif pertama: 3x² − 6xy + 6x²y.</li><li>Distributif kedua: −4x² + 16xy − 12x²y (−4 × −4xy = +16xy).</li><li>Gabungkan sejenis: −x² + 10xy − 6x²y.</li></ol><p><b>Jebakan:</b> salah tanda saat mengalikan −4, sehingga muncul 22xy atau +6x²y.</p>`},
{q:`Bentuk sederhana dari 2xy − xz − 6yz − 8xz + 5xy + 3yz adalah …`,o:['7xy − 7xz + 3yz','7xy − 9xz + 3yz','7xy + 9xz − 3yz','7xy − 9xz − 3yz'],a:3,il:'n8',
s:`xy: 2 + 5 = 7. xz: −1 − 8 = −9. yz: −6 + 3 = −3. Hasil <b>7xy − 9xz − 3yz</b>.`,
g:`<ol><li>Kelompokkan suku sejenis (variabel sama persis).</li><li>xy: 2xy + 5xy = 7xy. xz: −xz − 8xz = −9xz. yz: −6yz + 3yz = −3yz.</li></ol><p><b>Jebakan:</b> mengabaikan tanda minus pada −xz dan −6yz.</p>`},
{q:`Ayah lebih muda dari paman. Selisih umur ayah dan paman adalah 4 tahun. Jika jumlah umur ayah dan paman lebih dari 82 tahun, umur paman yang mungkin adalah …`,o:['44 tahun','43 tahun','42 tahun','41 tahun'],a:0,il:'n9',
s:`Umur paman p, ayah p − 4. p + (p − 4) &gt; 82 → 2p &gt; 86 → p &gt; 43. Yang memenuhi: <b>44 tahun</b>.`,
g:`<ol><li>Model: p + (p − 4) &gt; 82.</li><li>2p &gt; 86 → p &gt; 43 (lebih dari, bukan sama dengan).</li><li>Opsi yang lebih dari 43 hanya <b>44</b>.</li></ol><p><b>Jebakan:</b> memilih 43, yang menghasilkan jumlah tepat 82 (bukan lebih dari 82).</p>`},
{q:`Faisal mempunyai sejumlah uang. Dafa mempunyai uang dua puluh ribu lebihnya dari tiga kali uang Faisal. Rianggo mempunyai uang sepuluh ribu kurangnya dari lima kali uang Faisal. Jika nilai uang Dafa sama dengan nilai uang Rianggo, berapakah uang Faisal?`,o:['Rp15.000,00','Rp20.000,00','Rp25.000,00','Rp30.000,00'],a:0,il:'n10',
s:`Misal uang Faisal f. 3f + 20.000 = 5f − 10.000 → 30.000 = 2f → f = <b>Rp15.000</b>.`,
g:`<ol><li>Dafa = 3f + 20.000 (“lebihnya” = ditambah).</li><li>Rianggo = 5f − 10.000 (“kurangnya” = dikurangi).</li><li>Sama: 3f + 20.000 = 5f − 10.000 → 2f = 30.000 → f = <b>15.000</b>.</li></ol><p><b>Jebakan:</b> membalik arti “lebihnya” dan “kurangnya”.</p>`},
{q:`Penyelesaian pertidaksamaan −3(2x + 3) + 2 ≥ (4/3)(3x + 1) adalah …`,o:['x ≤ −5/6','x ≤ −2/3','x ≤ 2/3','x ≤ 5/6'],a:0,il:'n11',
s:`Kalikan 3: −9(2x + 3) + 6 ≥ 4(3x + 1) → −18x − 21 ≥ 12x + 4 → −30x ≥ 25. Dibagi −30 (tanda dibalik): <b>x ≤ −5/6</b>.`,
g:`<ol><li>Kalikan semua suku dengan 3 (tanda tetap): −18x − 27 + 6 ≥ 12x + 4.</li><li>Sederhanakan: −18x − 21 ≥ 12x + 4 → −30x ≥ 25.</li><li>Bagi −30, <b>tanda dibalik</b>: x ≤ −5/6.</li></ol><p><b>Jebakan:</b> lupa membalik tanda ≥ saat membagi bilangan negatif.</p>`}]},
pb:{t:'Perbandingan',d:'Pekerjaan bersama, persen, dan perbandingan senilai',q:[
{q:`Tukang pertama menyelesaikan pekerjaan dalam 12 hari, tukang kedua dalam 18 hari. Mereka bekerja bersama, tukang ketiga bergabung setelah 3 hari, dan seluruh pekerjaan selesai 6 hari sejak awal. Sendirian, tukang ketiga menyelesaikannya dalam …`,o:['9 hari','12 hari','15 hari','18 hari'],a:3,il:12,
s:`Anggap pekerjaan = 36 bagian: tukang 1 = 3/hari, tukang 2 = 2/hari. 6 hari → 30 bagian. Sisa 6 bagian dikerjakan tukang 3 dalam 3 hari → 2/hari → 36 ÷ 2 = <b>18 hari</b>.`,
g:`<ol><li>Kecepatan = 1 ÷ waktu: 1/12 + 1/18 = 5/36 per hari.</li><li>Dua tukang selama 6 hari: 6 × 5/36 = 30/36. Sisa 6/36.</li><li>Tukang 3 bekerja 3 hari: 6/36 ÷ 3 = 2/36 = 1/18 per hari → <b>18 hari</b>.</li></ol><p><b>Jebakan:</b> menjumlah waktu (12 + 18), atau lupa tukang 1 dan 2 tetap bekerja setelah tukang 3 datang.</p><p><i>Catatan guru: soal asli menyebut 7 hari (hasil 144 hari, tidak ada di opsi); di sini dikoreksi jadi 6 hari agar sesuai kunci D.</i></p>`},
{q:`Pelari pertama menyelesaikan satu lintasan dalam 40 menit, pelari kedua 60 menit, pelari ketiga 120 menit. Jika ketiganya berlari bersama, mereka menyelesaikan satu lintasan dalam …`,o:['18 menit','20 menit','22 menit','24 menit'],a:1,il:28,
s:`Gabungkan kecepatan: 1/40 + 1/60 + 1/120 = (3 + 2 + 1)/120 = 6/120 = 1/20 lintasan per menit → <b>20 menit</b>.`,
g:`<ol><li>Kecepatan tiap pelari = 1 ÷ waktunya.</li><li>Samakan penyebut (KPK = 120): 3/120 + 2/120 + 1/120 = 6/120.</li><li>Waktu = 1 ÷ (1/20) = <b>20 menit</b>. Cek: 20 ÷ 40 + 20 ÷ 60 + 20 ÷ 120 = 1.</li></ol><p><b>Jebakan:</b> merata-ratakan waktu (40 + 60 + 120) ÷ 3 = 73 menit.</p>`},
{q:`Pak Budi menabung Rp5.000.000 dengan bunga tunggal 8% per tahun. Setelah berapa tahun uangnya menjadi Rp6.400.000?`,o:['2,5 tahun','3 tahun','3,5 tahun','4 tahun'],a:2,il:17,
s:`Bunga = 6.400.000 − 5.000.000 = 1.400.000. Bunga per tahun = 8% × 5.000.000 = 400.000. Lama = 1.400.000 ÷ 400.000 = <b>3,5 tahun</b>.`,
g:`<ol><li>Bunga tunggal selalu dari modal awal: 8% × 5.000.000 = <b>400.000/tahun</b>.</li><li>Total bunga = 1.400.000.</li><li>Persamaan: 5.000.000 + 400.000 × t = 6.400.000 → t = 3,5.</li></ol><p><b>Jebakan:</b> memakai bunga berbunga (majemuk) atau lupa mengurangi modal.</p>`},
{q:`Barang elektronik dijual Rp4.500.000 sudah termasuk PPN 10%. Toko memberi diskon 15% untuk pembelian tunai. Harga setelah diskon (sudah termasuk PPN) adalah …`,o:['Rp3.675.000','Rp3.825.000','Rp3.960.000','Rp4.050.000'],a:1,il:26,
s:`Harga Rp4.500.000 sudah memuat PPN. Diskon 15% → bayar 85%: 0,85 × 4.500.000 = <b>Rp3.825.000</b>.`,
g:`<ol><li>Harga sudah termasuk PPN, jadi tidak ditambah PPN lagi.</li><li>Diskon 15% = 675.000 → 4.500.000 − 675.000.</li><li>Cara cepat: bayar 85% → 0,85 × 4.500.000 = <b>3.825.000</b>.</li></ol><p><b>Jebakan:</b> menambah PPN 10% lagi (3.825.000 × 1,1 = 4.207.500) atau menghitung diskon dari harga sebelum PPN.</p>`},
{q:`Tangki sepeda motor Bu Vera berisi 2 liter bahan bakar. Bahan bakar tersebut dapat digunakan untuk menempuh jarak 110 km. Jika sekarang bahan bakar di dalam tangki tersisa 0,5 liter, jarak yang telah ditempuh Bu Vera sejauh …`,o:['97,5 km','82,5 km','75 km','60 km'],a:1,il:'k5',
s:`Terpakai 2 − 0,5 = 1,5 liter. Perbandingan senilai: 2 L → 110 km, jadi 1 L = 55 km. 1,5 × 55 = <b>82,5 km</b>.`,
g:`<ol><li>Satu liter menempuh 110 ÷ 2 = <b>55 km</b>.</li><li>Yang ditanya jarak yang <b>sudah</b> ditempuh, jadi pakai bahan bakar terpakai: 2 − 0,5 = 1,5 L.</li><li>1,5 × 55 = <b>82,5 km</b>.</li></ol><p><b>Jebakan:</b> memakai sisa 0,5 L (0,5 × 55 = 27,5 km adalah jarak yang <i>masih bisa</i> ditempuh).</p>`},
{q:`Gista membeli buku bacaan di sebuah toko buku. Buku tersebut didiskon 15%. Gista membayar Rp68.000,00. Harga buku sebelum diskon adalah …`,o:['Rp69.500,00','Rp72.000,00','Rp80.000,00','Rp85.000,00'],a:2,il:'k6',
s:`Bayar 100% − 15% = 85% dari harga awal. 85% × harga = 68.000 → harga = 68.000 ÷ 0,85 = <b>Rp80.000</b>.`,
g:`<ol><li>Diskon 15% dari harga awal, jadi yang dibayar 85% dari harga awal.</li><li>85% = 68.000 → 1% = 800.</li><li>100% = 800 × 100 = <b>80.000</b>.</li></ol><p><b>Jebakan:</b> menambah 15% dari 68.000. Diskon dihitung dari harga awal, bukan dari harga bayar.</p>`},
{q:`Diana menabung di sebuah bank 30 bulan yang lalu. Tabungan Diana sekarang Rp3.000.000,00. Jika bank memberikan bunga tunggal 8% per tahun, tabungan Diana mula-mula adalah …`,o:['Rp2.400.000,00','Rp2.500.000,00','Rp2.600.000,00','Rp2.700.000,00'],a:1,il:'k7',
s:`30 bulan = 2,5 tahun → bunga = 8% × 2,5 = 20% dari modal. Tabungan sekarang = 120% modal → modal = 3.000.000 ÷ 1,2 = <b>Rp2.500.000</b>.`,
g:`<ol><li>30 ÷ 12 = 2,5 tahun. Bunga tunggal: 8% × 2,5 = <b>20%</b> dari modal.</li><li>Modal + bunga = 120% modal = 3.000.000 → 10% = 250.000.</li><li>100% = <b>2.500.000</b>. Cek: bunga 20% × 2.500.000 = 500.000.</li></ol><p><b>Jebakan:</b> menghitung bunga dari tabungan akhir (8% × 2,5 × 3.000.000 = 600.000) sehingga muncul opsi A. Bunga dihitung dari modal awal.</p>`},
{q:`Aline membeli 3 tangkai bunga mawar dan 4 tangkai bunga lili dengan harga Rp72.500,00. Jika perbandingan antara harga setangkai bunga mawar dan setangkai bunga lili adalah 3 : 5, harga 2 tangkai bunga mawar dan setangkai bunga lili adalah …`,o:['Rp20.000,00','Rp22.500,00','Rp27.500,00','Rp32.500,00'],a:2,il:'k20',
s:`Mawar = 3k, lili = 5k. 3(3k) + 4(5k) = 29k = 72.500 → k = 2.500. Mawar Rp7.500, lili Rp12.500. 2 mawar + 1 lili = 15.000 + 12.500 = <b>Rp27.500</b>.`,
g:`<ol><li>Misalkan harga mawar 3 kotak, lili 5 kotak (1 kotak = k).</li><li>3 mawar = 9 kotak, 4 lili = 20 kotak → 29 kotak = 72.500 → 1 kotak = <b>2.500</b>.</li><li>Mawar 3 × 2.500 = 7.500; lili 5 × 2.500 = 12.500.</li><li>2 mawar + 1 lili = 15.000 + 12.500 = <b>27.500</b>.</li></ol><p><b>Jebakan:</b> memakai angka 3 dan 5 sebagai harga, atau lupa mengalikan dengan banyak tangkai.</p>`},
{q:`Maket sebuah kompleks perkantoran dibuat dengan skala 1 : 150. Panjang dan lebar gedung sebenarnya berturut-turut 60 m dan 39 m. Lebar gedung dalam maket adalah …`,o:['80 cm','52 cm','40 cm','26 cm'],a:3,il:'k5b',
s:`Skala 1 : 150 → 1 cm maket = 150 cm asli. Lebar asli 39 m = 3.900 cm. Di maket: 3.900 ÷ 150 = <b>26 cm</b>.`,
g:`<ol><li>Samakan satuan dulu: 39 m = <b>3.900 cm</b>.</li><li>Ukuran maket = ukuran asli ÷ 150 (maket lebih kecil, jadi dibagi).</li><li>3.900 ÷ 150 = <b>26 cm</b>.</li></ol><p><b>Jebakan:</b> memakai panjang (60 m → 40 cm), mengalikan dengan 150, atau lupa mengubah meter ke cm.</p>`},
{q:`Bu Dewi membeli 1 kardus jeruk seharga Rp250.000,00. Berat jeruk dalam 1 kardus tersebut 10 kg. Bu Dewi menjual kembali jeruk-jeruk itu dan ingin mendapat keuntungan 10%. Harga jual jeruk per kilogram adalah …`,o:['Rp26.000,00','Rp27.500,00','Rp260.000,00','Rp275.000,00'],a:1,il:'k6b',
s:`Untung 10% → harga jual = 110% × 250.000 = 275.000 untuk 10 kg. Per kilogram: 275.000 ÷ 10 = <b>Rp27.500</b>.`,
g:`<ol><li>Modal 250.000 = 100%. Untung 10% = 25.000.</li><li>Harga jual seluruhnya = 250.000 + 25.000 = <b>275.000</b>.</li><li>Soal meminta harga <b>per kg</b>: 275.000 ÷ 10 = <b>27.500</b>.</li></ol><p><b>Jebakan:</b> berhenti di 275.000 (harga satu kardus, bukan per kilogram).</p>`},
{q:`Bu Vian meminjam uang di sebuah koperasi sebesar Rp4.800.000,00 dengan bunga pinjaman 5% per tahun. Jika pinjaman tersebut diangsur selama 15 bulan, besar angsuran per bulan adalah …`,o:['Rp300.000,00','Rp340.000,00','Rp400.000,00','Rp480.000,00'],a:1,il:'k7b',
s:`15 bulan = 15/12 tahun. Bunga = 5% × 15/12 × 4.800.000 = 300.000. Total = 5.100.000. Angsuran = 5.100.000 ÷ 15 = <b>Rp340.000</b>.`,
g:`<ol><li>Bunga 5% itu <b>per tahun</b>; 15 bulan = 1,25 tahun.</li><li>Bunga = 4.800.000 × 5% × 1,25 = <b>300.000</b>.</li><li>Total yang diangsur = 4.800.000 + 300.000 = 5.100.000 → ÷ 15 = <b>340.000</b>.</li></ol><p><b>Jebakan:</b> lupa menambah bunga (4.800.000 ÷ 15 = 320.000), atau memakai 5% × 15 seolah per bulan.</p>`},
{q:`Renovasi sebuah jembatan dapat selesai dikerjakan oleh 32 pekerja selama 18 hari. Karena musim hujan akan tiba, jembatan harus selesai 6 hari lebih cepat. Banyak pekerja yang perlu ditambahkan adalah …`,o:['8 orang','10 orang','12 orang','16 orang'],a:3,il:'m11',
s:`Berbalik nilai: pekerja × hari tetap. 32 × 18 = 576. Waktu baru 12 hari → 576 ÷ 12 = 48 pekerja. Tambahan 48 − 32 = <b>16 orang</b>.`,
g:`<ol><li>Beban kerja = 32 × 18 = <b>576</b> hari-orang.</li><li>Waktu baru = 18 − 6 = 12 hari → pekerja = 576 ÷ 12 = 48.</li><li>Yang <b>ditambahkan</b> = 48 − 32 = <b>16</b>.</li></ol><p><b>Jebakan:</b> menjawab 48 (total pekerja, bukan tambahannya).</p>`},
{q:`Peta kompleks desa berskala 1 : 1.200. Jarak rumah Wildan ke balai desa 8 cm dan jarak balai desa ke balai kesenian 14 cm. Wildan pergi dari rumah ke balai desa, kemudian ke balai kesenian. Jarak sebenarnya yang ditempuh Wildan adalah …`,o:['160 m','168 m','264 m','308 m'],a:2,il:'m12',
s:`Jarak di peta 8 + 14 = 22 cm. Sebenarnya 22 × 1.200 = 26.400 cm = <b>264 m</b>.`,
g:`<ol><li>Wildan menempuh dua ruas: 8 cm + 14 cm = 22 cm di peta.</li><li>Skala 1 : 1.200 → 22 × 1.200 = 26.400 cm.</li><li>Ubah ke meter: 26.400 ÷ 100 = <b>264 m</b>.</li></ol><p><b>Jebakan:</b> menghitung satu ruas saja (14 × 1.200 = 168 m) atau lupa mengubah cm ke m.</p>`},
{q:`Perbandingan berat tepung terigu, susu bubuk, dan mentega untuk membuat kue adalah 15 : 6 : 4. Jika jumlah berat ketiga bahan 1.250 gram, selisih antara berat tepung terigu dan mentega yang digunakan adalah …`,o:['550 gram','450 gram','300 gram','250 gram'],a:0,il:'m13',
s:`Jumlah bagian 15 + 6 + 4 = 25 → 1 bagian = 1.250 ÷ 25 = 50 g. Selisih tepung dan mentega = 15 − 4 = 11 bagian = <b>550 g</b>.`,
g:`<ol><li>Total bagian: 15 + 6 + 4 = <b>25</b>.</li><li>1 bagian = 1.250 ÷ 25 = <b>50 g</b>.</li><li>Tepung 750 g, mentega 200 g → selisih = <b>550 g</b>.</li></ol><p><b>Jebakan:</b> menghitung selisih tepung dan susu (9 bagian = 450 g).</p>`},
{q:`Pak Janu membeli sepeda motor seharga Rp8.500.000,00. Sepeda motor tersebut diperbaiki dengan biaya Rp500.000,00. Setelah itu, sepeda motor dijual dengan harga Rp10.800.000,00. Persentase keuntungan yang diperoleh Pak Janu sebesar …`,o:['10%','15%','20%','25%'],a:2,il:'n12',
s:`Modal = 8.500.000 + 500.000 = 9.000.000. Untung = 10.800.000 − 9.000.000 = 1.800.000. 1.800.000 ÷ 9.000.000 = <b>20%</b>.`,
g:`<ol><li>Biaya perbaikan ikut menjadi modal: 9.000.000.</li><li>Untung = 10.800.000 − 9.000.000 = 1.800.000.</li><li>Persen untung = untung ÷ modal × 100% = <b>20%</b>.</li></ol><p><b>Jebakan:</b> memakai 8.500.000 sebagai modal (hasilnya sekitar 21%, bukan opsi).</p>`},
{q:`Tira dapat membersihkan satu set meja-kursi selama 9 menit. Vino dapat membersihkan satu set meja-kursi tersebut selama 18 menit. Jika Tira dan Vino membersihkannya bersama-sama, mereka membutuhkan waktu selama …`,o:['5 menit','6 menit','7 menit','8 menit'],a:1,il:'n13',
s:`Kecepatan: 1/9 + 1/18 = 2/18 + 1/18 = 3/18 = 1/6 set per menit → <b>6 menit</b>.`,
g:`<ol><li>Kecepatan = 1 ÷ waktu: Tira 1/9, Vino 1/18 per menit.</li><li>Bersama: 2/18 + 1/18 = 3/18 = 1/6 per menit.</li><li>Waktu = 1 ÷ (1/6) = <b>6 menit</b>.</li></ol><p><b>Jebakan:</b> merata-ratakan waktu (9 + 18) ÷ 2 = 13,5 menit.</p>`}]}};

const MS={
bb:[
['🌡️ Mengenal bilangan bulat',`<p>Bilangan bulat = <b>negatif</b>, <b>nol</b>, dan <b>positif</b>. Dipakai untuk suhu di bawah nol, kedalaman laut, utang, atau lantai basement.</p><div class='fm'>… −3 −2 −1 <span style='color:var(--c3)'>0</span> 1 2 3 …</div><p><b>Aturan emas:</b> di garis bilangan, makin ke <b>kanan</b> makin <b>besar</b>. Jadi −2 lebih besar dari −7.</p>`,['Mana yang lebih besar: −7 atau −2?',['−7','−2','sama besar','tidak bisa dibandingkan'],1,'−2 berada lebih ke kanan daripada −7 di garis bilangan, jadi −2 lebih besar.']],
['➕➖ Tambah dan kurang',`<p>Tambah bilangan positif = geser ke <b>kanan</b>. Kurang bilangan positif = geser ke <b>kiri</b>.</p><div class='fm'>a − (−b) = a + b</div><p>Dua tanda minus berdampingan berubah menjadi <b>plus</b>. Contoh: 4 − (−3) = 4 + 3 = 7.</p>`,['−5 − (−8) = …',['−13','−3','3','13'],2,'Mengurangi negatif sama dengan menambah: −5 + 8 = 3.']],
['✖️➗ Kali, bagi, dan urutan',`<div class='fm'>tanda sama → <span style='color:var(--c2)'>+</span> &nbsp; tanda beda → <span style='color:var(--c4)'>−</span></div><p>Berlaku untuk kali dan bagi. Urutan hitung: <b>kurung</b> → <b>kali/bagi</b> (dari kiri) → <b>tambah/kurang</b>.</p><p>Contoh: 16 × (−15 : 3) + 24 : 8 = 16 × (−5) + 3 = −77.</p>`,['(−6) × 4 ÷ (−3) = …',['−8','8','−2','2'],1,'(−6) × 4 = −24, lalu −24 ÷ (−3) = 8 (tanda sama → positif).']],
['🔗 KPK dan FPB',`<p>Faktorkan ke bilangan prima. Contoh 12 = 2²×3 dan 18 = 2×3².</p><div class='fm'>FPB = pangkat <u>terkecil</u> faktor sama = 6<br>KPK = pangkat <u>terbesar</u> semua faktor = 36</div><p>KPK dipakai untuk kejadian <b>berulang serempak</b> (lampu berkedip, jadwal). FPB untuk membagi sama rata.</p>`,['KPK dari 8 dan 12 adalah …',['4','24','48','96'],1,'8 = 2³, 12 = 2²×3. Ambil pangkat terbesar: 2³ × 3 = 24.']]],
pc:[
['🍕 Memahami pecahan',`<p>Pecahan = <b>pembilang</b> (bagian yang diambil) per <b>penyebut</b> (jumlah bagian utuh). Pecahan senilai: 1/2 = 2/4 = 3/6.</p><div class='fm'>Membandingkan: samakan penyebut dulu</div><p>Contoh: 2/3, 3/5, 5/8 → penyebut 120 → 80/120, 72/120, 75/120.</p>`,['Mana yang terbesar: 2/3, 3/5, atau 5/8?',['2/3','3/5','5/8','sama besar'],0,'Setelah disamakan penyebutnya (120): 80, 72, 75. Yang terbesar 80/120 = 2/3.']],
['➕➖ Tambah dan kurang pecahan',`<p>Langkah: <b>1)</b> samakan penyebut dengan KPK, <b>2)</b> jumlahkan atau kurangkan pembilang saja, <b>3)</b> sederhanakan.</p><div class='fm'>1/4 + 1/6 = 3/12 + 2/12 = 5/12</div><p>Pembilang dijumlahkan, <b>penyebut tidak</b> ikut dijumlahkan.</p>`,['3/4 − 1/6 = …',['7/12','2/10','5/6','1/2'],0,'KPK 4 dan 6 = 12: 9/12 − 2/12 = 7/12.']],
['✖️➗ Kali dan bagi pecahan',`<div class='fm'>kali: atas × atas, bawah × bawah<br>bagi: kali <u>kebalikan</u></div><p>Contoh: 2/3 × 3/5 = 6/15 = 2/5. Dan 1/2 ÷ 1/4 = 1/2 × 4/1 = 2.</p>`,['2/3 ÷ 4/9 = …',['8/27','3/2','2/3','6/5'],1,'2/3 × 9/4 = 18/12 = 3/2.']],
['🔄 Pecahan, desimal, dan persen',`<p>Satu nilai, tiga wajah:</p><div class='fm'>1/2 = 0,5 = 50%</div><p>Pecahan campuran: 2¼ = 2 + 0,25 = 2,25. Untuk mengubah ke persen, kalikan 100%.</p>`,['3¼ jika ditulis desimal adalah …',['3,14','3,25','3,4','3,75'],1,'¼ = 0,25, jadi 3¼ = 3,25.']]],
hm:[
['🧺 Himpunan dan anggotanya',`<p>Himpunan = kumpulan benda yang <b>jelas</b> batasannya. Ditulis dengan kurung kurawal: A = {2, 3, 5, 7}.</p><div class='fm'>2 ∈ A &nbsp; · &nbsp; 4 ∉ A &nbsp; · &nbsp; n(A) = 4</div><p>n(A) = banyak anggota. Anggota yang sama ditulis <b>sekali</b>. Himpunan tanpa anggota = himpunan kosong { }.</p>`,['Banyak anggota himpunan huruf pada kata MATEMATIKA (huruf berbeda) adalah …',['6','10','8','5'],0,'Huruf berbeda: M, A, T, E, I, K = 6.']],
['🧱 Himpunan bagian',`<p>A ⊂ B artinya semua anggota A ada di B.</p><div class='fm'>banyak himpunan bagian = 2<sup>n</sup></div><p>Untuk {a, b, c}: 2³ = 8 (termasuk { } dan himpunan itu sendiri). Himpunan bagian dengan 2 anggota = memilih 2 dari 3 = 3 buah.</p>`,['Banyak himpunan bagian dari {a, b, c} adalah …',['3','6','8','9'],2,'2³ = 8.']],
['🔀 Operasi himpunan',`<p><b>Irisan</b> A ∩ B = anggota di kedua himpunan. <b>Gabungan</b> A ∪ B = anggota di salah satu. <b>Selisih</b> A − B = hanya di A. <b>Komplemen</b> A<sup>c</sup> = yang di luar A (dalam semesta S).</p><div class='fm'>A = {1,2,3,4}, B = {3,4,5}<br>A ∩ B = {3,4}</div>`,['Jika A = {1, 2, 3, 4} dan B = {3, 4, 5}, maka A − B = …',['{3, 4}','{1, 2}','{5}','{1, 2, 3, 4, 5}'],1,'A − B = anggota A yang tidak ada di B = {1, 2}.']],
['🔵 Diagram Venn',`<p>Dua lingkaran yang beririsan membantu menghitung orang yang suka dua hal.</p><div class='fm'>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</div><p>Yang berada di irisan terhitung dua kali, jadi harus dikurangi sekali. Sisanya di luar lingkaran = n(S) − n(A ∪ B).</p>`,['Dari 20 siswa, 12 suka bola, 9 suka basket, 5 suka keduanya. Yang tidak suka keduanya ada …',['4','3','5','8'],0,'12 + 9 − 5 = 16 yang suka minimal satu. 20 − 16 = 4.']]],
aj:[
['🔤 Mengenal bentuk aljabar',`<p>Pada <b>3x² + 5x − 7</b>: x variabel, 3 dan 5 koefisien, −7 konstanta, tiga bagian dipisah tanda + atau − disebut <b>suku</b>.</p><div class='fm'>suku sejenis = variabel dan pangkat sama</div><p>3x dan 5x sejenis (bisa dijumlah). 3x dan 3x² <b>tidak</b> sejenis.</p>`,['Koefisien x pada 4x² − 9x + 2 adalah …',['4','−9','2','9'],1,'Suku x adalah −9x, jadi koefisiennya −9 (tanda ikut).']],
['🧮 Operasi aljabar',`<p>Jumlah atau kurang hanya untuk suku sejenis. Kurung yang didahului minus: semua tanda di dalamnya <b>berbalik</b>.</p><div class='fm'>(3x + 2) − (x − 5) = 3x + 2 − x + 5</div><p>Perkalian: a(b + c) = ab + ac (sifat distributif).</p>`,['(3x + 2) − (x − 5) = …',['2x − 3','2x + 7','4x + 7','4x − 3'],1,'3x + 2 − x + 5 = 2x + 7.']],
['⚖️ Persamaan linear satu variabel',`<p>Persamaan itu seperti <b>neraca seimbang</b>: apa pun yang kamu lakukan di kiri harus dilakukan juga di kanan.</p><div class='fm'>2x + 3 = 11 → 2x = 8 → x = 4</div><p>Pindah ruas = lawan operasinya (+ jadi −, × jadi ÷).</p>`,['3x − 5 = 16, maka x = …',['3','5','7','21'],2,'3x = 21, jadi x = 7.']],
['🚦 Pertidaksamaan linear',`<p>Caranya sama dengan persamaan, tetapi tanda <b>dibalik</b> jika kedua ruas dikali atau dibagi bilangan <b>negatif</b>.</p><div class='fm'>−2x &lt; 10 → x &gt; −5</div><p>Penyelesaian berupa daerah di garis bilangan, bukan satu titik.</p>`,['−2x < 10 mempunyai penyelesaian …',['x < −5','x > −5','x < 5','x > 5'],1,'Dibagi −2, tanda < dibalik menjadi >: x > −5.']]],
pb:[
['🗺️ Rasio dan skala',`<p>Perbandingan a : b dapat disederhanakan seperti pecahan. 12 : 18 = 2 : 3.</p><div class='fm'>skala = jarak di peta : jarak sebenarnya</div><p>Skala 1 : 200.000 artinya 1 cm di peta = 200.000 cm = 2 km asli.</p>`,['Skala 1 : 200.000, jarak di peta 3 cm. Jarak sebenarnya …',['6 km','60 km','600 m','0,6 km'],0,'3 × 200.000 = 600.000 cm = 6 km.']],
['➡️ Perbandingan senilai',`<p>Makin banyak → makin banyak. Pakai <b>cara satuan</b>: cari nilai untuk 1, lalu kalikan.</p><div class='fm'>5 buku = Rp40.000 → 1 buku = Rp8.000</div>`,['5 buku harganya Rp40.000. Harga 8 buku …',['Rp56.000','Rp64.000','Rp72.000','Rp80.000'],1,'1 buku = 8.000, jadi 8 buku = 64.000.']],
['🔁 Perbandingan berbalik nilai',`<p>Makin banyak → makin <b>sedikit</b>. Contoh: pekerja dan waktu.</p><div class='fm'>pekerja × hari = tetap</div><p>6 pekerja × 10 hari = 60 “hari-orang”. Pekerjaan bersama dengan laju berbeda dihitung memakai pecahan (1 ÷ waktu).</p>`,['6 pekerja menyelesaikan 10 hari. Jika 4 pekerja, selesai dalam …',['12 hari','15 hari','18 hari','20 hari'],1,'6 × 10 = 60, lalu 60 ÷ 4 = 15 hari.']],
['🏷️ Persen dan aritmetika sosial',`<p>Persen = per 100. <b>Diskon</b> mengurangi harga, <b>untung</b> menambah, <b>bunga tunggal</b> dihitung dari modal awal.</p><div class='fm'>bayar = harga × (100% − diskon)</div><p>Bunga tunggal: bunga = modal × persen × waktu (tahun).</p>`,['Harga Rp200.000 diskon 25%. Yang dibayar …',['Rp50.000','Rp150.000','Rp175.000','Rp225.000'],1,'Bayar 75% × 200.000 = 150.000.']]]};
